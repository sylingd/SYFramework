name: "Unit Test"

on:
  workflow_call:

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php-version: [8.1, 8.5]
    env:
      extensions: mbstring, redis, curl, yac, memcached, yaconf
      key: v1
    steps:
    - uses: actions/checkout@v6

    - name: Setup cache environment
      id: extcache
      uses: shivammathur/cache-extensions@v1
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: ${{ env.extensions }}
        key: ${{ env.key }}

    - name: Cache extensions
      uses: actions/cache@v4
      with:
        path: ${{ steps.extcache.outputs.dir }}
        key: ${{ steps.extcache.outputs.key }}
        restore-keys: ${{ steps.extcache.outputs.key }}

    - name: Setup PHP with PECL extension
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: ${{ env.extensions }}
        tools: composer:v2
        ini-values: yac.enable = On, yac.enable_cli = On

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-
      
    - name: Start Redis
      uses: supercharge/redis-github-action@1.8.1
      with:
        redis-version: 6

    - name: Start MySQL
      run: sudo systemctl start mysql.service

    - name: Start Memcached
      uses: niden/actions-memcached@v8

    - name: Install dependencies
      run: composer install --prefer-dist

    - name: Init test data
      run: |
        mysql -uroot -proot < $GITHUB_WORKSPACE/tests/App/mysql.sql

    - name: Test unit tests
      run: composer test

    - name: Coverage
      run: |
        composer global require php-coveralls/php-coveralls
        php-coveralls --coverage_clover=report/clover.xml -v

    - name: Upload reports
      uses: actions/upload-artifact@v7
      with:
        name: report
        retention-days: 1
        path: report
