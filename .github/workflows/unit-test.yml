name: "Unit Test"

on:
  workflow_call:

jobs:
  unit-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-version: [8.1, 8.2, 8.3, 8.4, 8.5]
    env:
      PHP_EXTENSIONS: mbstring, redis, curl, yac, memcached, yaconf, yaf, pdo_mysql, pdo_sqlite, pdo_pgsql
      PHP_EXTENSIONS_KEY: v2
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_PASSWORD: root
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U root"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    - uses: actions/checkout@v6

    - name: Setup cache environment
      id: extcache
      uses: shivammathur/cache-extensions@v1
      with:
        php-version: ${{ matrix.php-version }}
        extensions: ${{ env.PHP_EXTENSIONS }}
        key: ${{ env.PHP_EXTENSIONS_KEY }}

    - name: Cache extensions
      uses: actions/cache@v6
      with:
        path: ${{ steps.extcache.outputs.dir }}
        key: ${{ steps.extcache.outputs.key }}
        restore-keys: ${{ steps.extcache.outputs.key }}

    - name: Setup PHP with PECL extension
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-version }}
        extensions: ${{ env.PHP_EXTENSIONS }}
        coverage: pcov
        tools: composer:v2
        ini-values: yac.enable = On, yac.enable_cli = On, yaconf.directory = ${{ github.workspace }}/tests/App/yaconf

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@v6
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Start Redis
      uses: supercharge/redis-github-action@1.8.1
      with:
        redis-version: 6

    - name: Start MySQL
      run: sudo systemctl start mysql.service

    - name: Start Memcached
      uses: niden/actions-memcached@v8

    - name: Install dependencies
      run: composer install --prefer-dist

    - name: Init test data
      run: |
        mysql -uroot -proot < $GITHUB_WORKSPACE/tests/App/mysql.sql

    - name: Test unit tests
      run: composer test

    - name: Upload reports
      uses: actions/upload-artifact@v7
      with:
        name: report-${{ matrix.php-version }}
        retention-days: 1
        path: report/
